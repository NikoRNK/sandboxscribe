title: Office Application Spawns Command Interpreter (observed in sandbox)
id: 95ceea91-939b-59f9-b500-4bc168d80d1b
status: experimental
description: Child process of an Office application matching behaviour seen during detonation.
author: SandboxScribe
date: 2026/11/01
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\winword.exe'
        Image|endswith:
            - '\cmd.exe'
    condition: selection
